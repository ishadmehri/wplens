<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wplens</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#f6f7f9; --card:#fff; --ink:#1a1d21; --muted:#6b7280; --line:#e5e7eb;
    --ok:#0f9d6b; --warn:#b91c1c; --accent:#0f9d6b; --accent-ink:#fff; --chip:#e8f5ee;
  }
  @media (prefers-color-scheme: dark){ :root{
    --bg:#0e1512; --card:#15201b; --ink:#e6ece8; --muted:#93a49b; --line:#25342c;
    --ok:#34e0a1; --warn:#f87171; --accent:#34e0a1; --accent-ink:#06231a; --chip:#1c2a23;
  }}
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    width:380px; max-height:600px; overflow-y:auto;
    background:var(--bg); color:var(--ink);
    font:13px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  header {
    position:sticky; top:0; z-index:2; background:var(--bg);
    display:flex; align-items:center; gap:8px; padding:12px 14px 8px;
    border-bottom:1px solid var(--line);
  }
  header .glyph { flex:0 0 auto; border-radius:6px; display:block; }
  header .logo { font-weight:700; letter-spacing:-.02em; font-size:15px; }
  header .logo b { color:var(--accent); }
  header .url { color:var(--muted); font-size:11px; margin-left:auto; max-width:200px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:ltr; text-align:right; }
  .toolbar { display:flex; align-items:center; gap:10px; padding:8px 14px; }
  .toolbar label { display:flex; align-items:center; gap:6px; color:var(--muted); cursor:pointer; user-select:none; }
  .toolbar .spacer { margin-left:auto; }
  button.rescan {
    background:var(--accent); color:var(--accent-ink); border:0; border-radius:7px;
    padding:5px 12px; font-weight:600; cursor:pointer; font-size:12px;
  }
  button.rescan:disabled { opacity:.5; cursor:default; }
  button.ghost {
    background:transparent; color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:5px 12px; font-weight:600; cursor:pointer; font-size:12px;
  }
  button.ghost:disabled { opacity:.4; cursor:default; }
  button.ghost.done { color:var(--ok); border-color:var(--ok); }
  main { padding:4px 14px 16px; }
  .section { margin-top:12px; }
  .section h3 { font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:0 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .kv { display:flex; justify-content:space-between; gap:10px; padding:2px 0; }
  .kv .k { color:var(--muted); }
  .kv .v { text-align:right; direction:ltr; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .pill { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; }
  .pill.ok { background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok); }
  .pill.no { background:var(--chip); color:var(--muted); }
  .plugin { display:flex; align-items:center; gap:8px; padding:5px 0; border-top:1px solid var(--line); }
  .plugin:first-child { border-top:0; }
  .plugin .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plugin .ver { color:var(--muted); }
  .conf { font-size:9px; padding:1px 5px; border-radius:4px; background:var(--chip); color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .conf.high,.conf.confirmed { color:var(--ok); }
  .muted { color:var(--muted); }
  .warn { color:var(--warn); font-weight:600; }
  .hint { display:flex; gap:6px; padding:2px 0; }
  .hint::before { content:"›"; color:var(--accent); }
  .state { text-align:center; padding:34px 16px; color:var(--muted); }
  .spinner { width:22px; height:22px; margin:0 auto 10px; border:2px solid var(--line);
    border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  footer { padding:8px 14px 12px; color:var(--muted); font-size:10px; text-align:center; }
  .shot { display:block; width:100%; margin-top:8px; border-radius:8px; border:1px solid var(--line); }
  .v.warn { color:var(--warn); font-weight:600; }
  .cached { font-size:11px; color:var(--muted); background:var(--chip); border-radius:7px;
    padding:5px 9px; margin-top:10px; text-align:center; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { background:var(--chip); border-radius:6px; padding:2px 7px; font-size:11px; }
</style>
</head>
<body>
  <header>
    <img class="glyph" src="icons/icon48.png" width="24" height="24" alt="" aria-hidden="true">
    <span class="logo">wp<b>lens</b></span>
    <span class="url" id="url"></span>
  </header>
  <div class="toolbar">
    <label><input type="checkbox" id="deep"> Deep scan</label>
    <span class="spacer"></span>
    <button class="ghost" id="copy" disabled>Copy</button>
    <button class="rescan" id="rescan">Scan</button>
  </div>
  <main id="out">
    <div class="state"><div class="spinner"></div>Scanning…</div>
  </main>
  <footer>wplens · public-signal profiling only</footer>
  <script src="popup.js"></script>
</body>
</html>
